<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>แลกของแถม</title>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		:root { --green:#00AE3D; --red:#E82128; --yellow:#FCDC0F; --bg:#f4f6f5; --ink:#1d2320; --muted:#6b736f; --line:#e4e9e6; }
		* { box-sizing:border-box; }
		body { margin:0; font-family:'IBM Plex Sans Thai',sans-serif; background:var(--bg); color:var(--ink); }
		header { background:var(--green); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; position:sticky; top:0; z-index:5; }
		header h1 { font-size:16px; margin:0; line-height:1.25; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
		header h1 small { display:block; font-size:12px; font-weight:400; opacity:.85; overflow:hidden; text-overflow:ellipsis; }
		header .actions { display:flex; gap:6px; flex-shrink:0; }
		header button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:6px 8px; font:inherit; font-size:13px; white-space:nowrap; }
		header button.on { background:#fff; color:var(--green); }
		main { padding:14px; max-width:560px; margin:0 auto; }
		.card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
		label, .lbl { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
		input[type=text], input[type=password], input[type=number], input:not([type]) { width:100%; font:inherit; font-size:20px; padding:11px 12px; border:2px solid #dde3e0; border-radius:10px; background:#fff; }
		input:focus { outline:none; border-color:var(--green); }
		input:disabled { background:#f3f5f4; color:#999; }
		.sm-input { font-size:15px !important; padding:8px 10px !important; }
		.field + .field { margin-top:10px; }
		.btn { width:100%; border:0; border-radius:12px; padding:15px; font:inherit; font-size:17px; font-weight:700; margin-top:10px; }
		.btn-primary { background:var(--green); color:#fff; }
		.btn-ghost { background:#e9eeeb; color:var(--ink); }
		.btn-danger { background:var(--red); color:#fff; }
		.btn-outline { background:#fff; color:var(--green); border:2px dashed #b9dfc7; }
		.btn:disabled { opacity:.5; }
		.btn, .gift-btn, header button, .ev-card, .tab, .btn-void, .chip { transition:transform .08s ease, filter .08s ease, background-color .15s ease; -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
		.btn:not(:disabled):active, header button:active, .tab:active, .chip:active { transform:scale(.95); filter:brightness(.88); }
		.gift-btn:not(:disabled):active, .ev-card:active { transform:scale(.97); background:#e3f6ea; }
		.hidden { display:none !important; }
		.err { color:var(--red); font-size:14px; margin-top:8px; }
		.muted { color:var(--muted); }
		.row-between { display:flex; justify-content:space-between; align-items:center; gap:8px; }

		/* ของรางวัล */
		.gift-img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; display:block; background:#eef1ef; }
		.gift-ph { width:100%; aspect-ratio:1/1; border-radius:10px; background:#eef1ef; display:flex; align-items:center; justify-content:center; font-size:34px; }
		.gift-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
		.gift-btn { display:block; width:100%; background:#fff; border:3px solid var(--green); border-radius:14px; padding:10px; font:inherit; text-align:center; }
		.gift-btn .n { font-size:16px; font-weight:700; line-height:1.3; margin-top:8px; }
		.gift-btn .r { color:var(--muted); font-size:13px; }
		.gift-btn:disabled { border-color:#ccc; opacity:.5; }

		/* คงเหลือ */
		.stock { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
		.stock > div { background:#f7faf8; border-radius:10px; padding:10px; text-align:center; }
		.stock .gift-img, .stock .gift-ph { width:60px; margin:0 auto 6px; font-size:22px; }
		.stock b { font-size:24px; display:block; }
		.stock small { color:var(--muted); font-size:12px; }
		.stock > div.low { background:#fff6d1; box-shadow:inset 0 0 0 2px var(--yellow); }
		.stock > div.low b { color:#a07800; }
		.stock > div.out { background:#fde8e9; box-shadow:inset 0 0 0 2px var(--red); }
		.stock > div.out b { color:var(--red); }
		.badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; margin-top:4px; }
		.low .badge { background:var(--yellow); color:#5c4500; }
		.out .badge { background:var(--red); color:#fff; }

		/* ผลลัพธ์ */
		.result { border-radius:14px; padding:18px; color:#fff; text-align:center; }
		.result h2 { margin:0 0 6px; font-size:24px; }
		.result p { margin:4px 0; font-size:16px; }
		.result .gift-img, .result .gift-ph { width:130px; margin:10px auto; border:3px solid rgba(255,255,255,.7); }
		.ok { background:var(--green); }
		.dup { background:var(--red); }
		.warn { background:#b88a00; }
		.result .note { font-size:13px; opacity:.85; margin-top:10px; }

		/* รายการ */
		.recent { font-size:13px; }
		.recent .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #eef1ef; }
		.recent .meta { display:flex; align-items:center; gap:8px; color:#999; white-space:nowrap; }
		.recent .row.voided .txt { text-decoration:line-through; color:#999; }
		.tag { font-size:11px; padding:2px 6px; border-radius:6px; color:#fff; white-space:nowrap; }
		.tag.r { background:var(--green); } .tag.d { background:var(--red); } .tag.v { background:#999; }
		.btn-void { border:1px solid #e3c2c4; background:#fff; color:var(--red); border-radius:8px; padding:4px 10px; font:inherit; font-size:12px; }

		/* modal */
		.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; }
		.modal { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:400px; text-align:center; }
		.modal .btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

		/* สรุป */
		.sum-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
		.sum-grid div { background:#f7faf8; border-radius:10px; padding:10px; text-align:center; }
		.sum-grid b { font-size:24px; display:block; }
		.sum-grid small { color:var(--muted); font-size:12px; }
		.sum-grid .red b { color:var(--red); }
		table.sum { width:100%; border-collapse:collapse; font-size:13px; }
		table.sum th { text-align:left; color:var(--muted); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); }
		table.sum td { padding:6px 4px; border-bottom:1px solid #f0f3f1; vertical-align:middle; }
		table.sum .num { text-align:right; white-space:nowrap; }
		.bar-wrap { background:#eef1ef; border-radius:5px; width:100%; }
		.bar { height:10px; border-radius:5px; background:var(--green); min-width:2px; }
		.dup-item { padding:8px 0; border-bottom:1px solid #f0f3f1; font-size:13px; }
		.dup-item b { font-size:15px; }
		.dup-item .times { color:var(--red); font-weight:700; }

		/* admin */
		.ev-card { display:block; width:100%; text-align:left; background:#fff; border:0; border-radius:14px; padding:14px; margin-bottom:10px; font:inherit; box-shadow:0 1px 3px rgba(0,0,0,.06); }
		.ev-card .t { font-size:16px; font-weight:700; }
		.ev-card .s { font-size:13px; color:var(--muted); margin-top:2px; }
		.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; }
		.pill.on { background:#e3f6ea; color:#00782a; }
		.pill.off { background:#eee; color:#888; }
		.tabs { display:flex; gap:6px; margin-bottom:12px; }
		.tab { flex:1; border:0; border-radius:10px; padding:10px; font:inherit; font-size:14px; font-weight:600; background:#e9eeeb; color:var(--ink); }
		.tab.on { background:var(--green); color:#fff; }
		.check { display:flex; align-items:center; gap:10px; padding:9px 0; font-size:15px; }
		.check input { width:22px; height:22px; accent-color:var(--green); flex-shrink:0; }
		.check.disabled { opacity:.45; }
		.hint { font-size:12px; color:var(--muted); margin-top:4px; }
		.gift-edit { display:grid; grid-template-columns:84px 1fr; gap:10px; padding:10px 0; border-bottom:1px solid #eef1ef; align-items:start; }
		.gift-edit .pic { position:relative; width:84px; }
		.gift-edit .pic .gift-img, .gift-edit .pic .gift-ph { width:84px; font-size:24px; cursor:pointer; }
		.gift-edit .pic span { position:absolute; bottom:4px; left:4px; right:4px; background:rgba(0,0,0,.55); color:#fff; font-size:10px; text-align:center; border-radius:6px; padding:1px 0; pointer-events:none; }
		.gift-edit .cols { display:grid; grid-template-columns:1fr 90px; gap:8px; }
		.gift-edit .acts { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:12px; }
		.chip { border:1px solid #e3c2c4; background:#fff; color:var(--red); border-radius:8px; padding:4px 10px; font:inherit; font-size:12px; }
		.chip.g { border-color:#d6dcd9; color:var(--muted); }

		/* บัญชีผู้ใช้ / ประวัติ */
		.admin-nav { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:8px; margin-bottom:12px; }
		.admin-nav .btn { margin:0; font-size:14px; padding:12px 6px; position:relative; }
		.dot { position:absolute; top:6px; right:8px; min-width:18px; height:18px; border-radius:9px; background:var(--red); color:#fff; font-size:11px; line-height:18px; padding:0 5px; }
		.u-row { padding:10px 0; border-bottom:1px solid #eef1ef; }
		.u-row .n { font-weight:700; }
		.u-row .s { font-size:12px; color:var(--muted); }
		.u-row .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
		.chip.ok { border-color:#b9dfc7; color:#00782a; }
		.pill.admin { background:#e8efff; color:#2752c9; }
		.pill.user { background:#eef1ef; color:#555; }
		.au-row { padding:8px 0; border-bottom:1px solid #f0f3f1; font-size:13px; }
		.au-row .h { display:flex; justify-content:space-between; gap:8px; }
		.au-row .a { font-weight:700; }
		.au-row .d { color:var(--muted); margin-top:2px; }
		.au-row .who { color:var(--green); font-weight:600; }

		/* หลายบิล */
		.btn-sm { padding:9px !important; font-size:14px !important; margin-top:8px !important; }
		.bill-head, .bill-row { display:grid; gap:8px; align-items:center; }
		.bill-head.c2, .bill-row.c2 { grid-template-columns:1fr 120px 30px; }
		.bill-head.c1, .bill-row.c1 { grid-template-columns:1fr 30px; }
		.bill-head { font-size:13px; color:var(--muted); margin-bottom:4px; }
		.bill-head .num { text-align:right; }
		.bill-row + .bill-row { margin-top:6px; }
		.bill-row .bill-amt { text-align:right; }
		.bill-del { border:0; background:#f1f3f2; color:#999; border-radius:8px; height:36px; font-size:13px; }
		.bill-total { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding:10px 12px; background:#f0faf3; border-radius:10px; font-size:15px; }
		.bill-total b { font-size:20px; color:var(--green); }
		.hint.ok-text { color:var(--green); }
		.hint.ok-text::after { content:' ✓ ครบแล้ว'; }
		textarea { width:100%; font:inherit; font-size:15px; padding:9px 10px; border:2px solid #dde3e0; border-radius:10px; resize:vertical; }
		textarea:focus { outline:none; border-color:var(--green); }
		table.bills-tbl { width:100%; border-collapse:collapse; font-size:14px; margin:10px 0; }
		table.bills-tbl td { padding:5px 4px; border-bottom:1px solid #eef1ef; text-align:left; }
		table.bills-tbl .num { text-align:right; white-space:nowrap; }
		table.bills-tbl tr.tot td { font-weight:700; border-bottom:0; border-top:2px solid #dde3e0; }
		table.bills-tbl.on-dark { background:rgba(255,255,255,.14); border-radius:10px; }
		table.bills-tbl.on-dark td { border-color:rgba(255,255,255,.25); padding:5px 10px; }
		table.bills-tbl.on-dark tr.tot td { border-top-color:rgba(255,255,255,.6); }

		/* รูปถ่าย */
		.photo-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
		.photo-grid .ph { position:relative; }
		.photo-grid img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; display:block; }
		.photo-grid button { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:11px; line-height:22px; padding:0; }
		.photo-grid:empty { display:none; }

		/* รายละเอียดรายการ */
		.recent .row.clickable { cursor:pointer; }
		.modal.detail { text-align:left; max-height:86vh; overflow:auto; }
		.kv { display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:14px; border-bottom:1px solid #f0f3f1; }
		.kv span:first-child { color:var(--muted); }
		.note-box { background:#fffbe6; border-radius:10px; padding:10px; font-size:14px; margin-top:8px; white-space:pre-wrap; }
		.detail-photos { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
		.detail-photos img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; cursor:zoom-in; }
		.photo-view { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:30; display:flex; align-items:center; justify-content:center; padding:10px; }
		.photo-view img { max-width:100%; max-height:100%; border-radius:6px; }
	</style>
</head>
<body>
	<header>
		<h1 id="hdr-title">🎁 แลกของแถม</h1>
		<div class="actions hidden" id="hdr-staff">
			<button id="btn-back-admin" class="hidden" onclick="backToAdmin()">← Admin</button>
			<button id="btn-switch" class="hidden" onclick="showEventPicker()">⇄</button>
			<button id="btn-summary" onclick="toggleStaffSummary()">📊 สรุป</button>
			<button id="btn-csv-staff" onclick="exportCsv(S.event.id)">⬇ CSV</button>
			<button onclick="refreshStaff()">↻</button>
			<button id="btn-logout-staff" onclick="logout()">ออก</button>
		</div>
		<div class="actions hidden" id="hdr-admin">
			<button onclick="logout()">ออก</button>
		</div>
	</header>

	<main>
		<!-- ===== LOGIN ===== -->
		<div id="view-login">
			<div class="card">
				<div class="field">
					<label>Username</label>
					<input id="li-user" class="sm-input" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="เช่น nid">
				</div>
				<div class="field">
					<label>PIN</label>
					<input id="li-pin" class="sm-input" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="PIN">
				</div>
				<button class="btn btn-primary" id="btn-login" onclick="login()">เข้าสู่ระบบ</button>
				<div class="err" id="err-login"></div>
			</div>
			<button class="btn btn-ghost" onclick="showView('view-register')">ยังไม่มีบัญชี? สมัครใช้งาน</button>
		</div>

		<!-- ===== REGISTER ===== -->
		<div id="view-register" class="hidden">
			<div class="card">
				<div style="font-size:17px;font-weight:700;margin-bottom:6px">สมัครใช้งาน</div>
				<div class="hint" style="margin-bottom:10px">สมัครแล้วต้องรอ Admin อนุมัติก่อนเข้าใช้งาน</div>
				<div class="field"><label>ชื่อ-นามสกุล / ชื่อเล่น (แสดงในรายการ)</label><input id="rg-name" class="sm-input" placeholder="เช่น นิด สมใจ"></div>
				<div class="field"><label>Username (a-z 0-9 . _ 3-20 ตัว)</label><input id="rg-user" class="sm-input" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="เช่น nid"></div>
				<div class="field"><label>PIN (4-20 ตัว)</label><input id="rg-pin" class="sm-input" type="password" autocomplete="new-password" placeholder="PIN"></div>
				<div class="field"><label>ยืนยัน PIN</label><input id="rg-pin2" class="sm-input" type="password" autocomplete="new-password" placeholder="PIN อีกครั้ง"></div>
				<button class="btn btn-primary" id="btn-register" onclick="doRegister()">ส่งคำขอสมัคร</button>
				<div class="err" id="err-register"></div>
			</div>
			<button class="btn btn-ghost" onclick="showView('view-login')">← กลับไปหน้าเข้าสู่ระบบ</button>
		</div>

		<!-- ===== USER: ใส่รหัสสาขา ===== -->
		<div id="view-branch" class="hidden">
			<div class="card">
				<label>รหัสสาขา</label>
				<input id="br-code" inputmode="numeric" autocomplete="off" placeholder="เช่น 05432">
				<button class="btn btn-primary" id="btn-branch" onclick="submitBranch()">ไปต่อ</button>
				<div class="err" id="err-branch"></div>
			</div>
			<button class="btn btn-ghost" onclick="openChangePin()">🔑 เปลี่ยน PIN ของฉัน</button>
		</div>

		<!-- ===== STAFF: เลือก Event (สาขาที่เปิดหลาย Event) ===== -->
		<div id="view-staff-pick" class="hidden">
			<div class="lbl" id="pick-title" style="margin-bottom:8px"></div>
			<div id="pick-list"></div>
			<button class="btn btn-ghost" onclick="showBranchView()">⇄ เปลี่ยนสาขา</button>
		</div>

		<!-- ===== STAFF ===== -->
		<div id="view-staff" class="hidden">
			<div class="hint" id="staff-who" style="margin:0 2px 8px"></div>
			<div class="card" id="step-input">
				<div id="input-fields"></div>
				<button class="btn btn-primary" id="btn-check" onclick="check()">ตรวจสอบ</button>
				<div class="err" id="err"></div>
			</div>

			<div id="step-result" class="hidden"></div>

			<div class="card">
				<label>คงเหลือ</label>
				<div class="stock" id="stock">กำลังโหลด...</div>
			</div>

			<div class="card">
				<label>รายการล่าสุด</label>
				<div class="recent" id="recent"></div>
			</div>
		</div>

		<!-- ===== STAFF SUMMARY ===== -->
		<div id="view-staff-summary" class="hidden">
			<div id="staff-summary-body"></div>
			<button class="btn btn-ghost" onclick="toggleStaffSummary()">← กลับไปหน้าแลก</button>
		</div>

		<!-- ===== ADMIN: รายการ Event ===== -->
		<div id="view-admin-list" class="hidden">
			<div class="admin-nav">
				<button class="btn btn-primary" onclick="openEditor(null)">+ สร้าง Event</button>
				<button class="btn btn-ghost" onclick="showUsers()">👥 ผู้ใช้<span class="dot hidden" id="pending-dot"></span></button>
				<button class="btn btn-ghost" onclick="showAudit()">📜 ประวัติ</button>
			</div>
			<div id="event-list"><div class="card muted">กำลังโหลด...</div></div>
		</div>

		<!-- ===== ADMIN: ผู้ใช้ ===== -->
		<div id="view-admin-users" class="hidden">
			<div class="row-between" style="margin-bottom:10px">
				<button class="chip g" onclick="showAdminList()">← Event ทั้งหมด</button>
				<button class="chip g" onclick="openChangePin()">🔑 เปลี่ยน PIN ของฉัน</button>
			</div>
			<div id="users-body"><div class="card muted">กำลังโหลด...</div></div>
		</div>

		<!-- ===== ADMIN: ประวัติทั้งระบบ ===== -->
		<div id="view-admin-audit" class="hidden">
			<div class="row-between" style="margin-bottom:10px">
				<button class="chip g" onclick="showAdminList()">← Event ทั้งหมด</button>
				<label class="check" style="padding:0;font-size:13px"><input type="checkbox" id="audit-hide-login" checked onchange="showAudit()"> ซ่อนการเข้าสู่ระบบ</label>
			</div>
			<div class="card"><div id="audit-body" class="muted">กำลังโหลด...</div></div>
		</div>

		<!-- ===== ADMIN: Event ===== -->
		<div id="view-admin-event" class="hidden">
			<div class="row-between" style="margin-bottom:10px">
				<button class="chip g" onclick="showAdminList()">← Event ทั้งหมด</button>
				<button class="chip g" onclick="exportCsv(A.eventId)">⬇ CSV</button>
			</div>
			<div class="card">
				<div class="row-between">

				<button class="tab" data-tab="log" onclick="adminTab('log')">รายการ</button>
				<button class="tab" data-tab="history" onclick="adminTab('history')">ประวัติ</button>

		<!-- ===== ADMIN: สร้าง / แก้ Event ===== -->
		<div id="view-admin-edit" class="hidden">

				<label class="check"><input type="checkbox" id="ed-use-amount" onchange="syncEditorChecks()"> ยอดบิล (กรอกได้หลายบิล รวมเป็น Total)</label>
				<label class="check" id="ed-note-row"><input type="checkbox" id="ed-use-note"> หมายเหตุ</label>
				<label class="check" id="ed-photo-row"><input type="checkbox" id="ed-use-photos"> อัปโหลดรูป (กี่รูปก็ได้)</label>
				<div class="field hidden" id="ed-min-wrap">
					<label>ยอดรวม (Total) ขั้นต่ำ (บาท) — เว้นว่าง = ไม่กำหนด</label>
					<input id="ed-min" class="sm-input" inputmode="decimal" placeholder="เช่น 300">
				</div>

				<div class="lbl" style="margin-top:12px">กันแลกซ้ำด้วย</div>
				<label class="check" id="ed-dedup-member-row"><input type="checkbox" id="ed-dedup-member"> รหัสสมาชิก (1 คน รับได้ 1 ครั้ง)</label>
				<label class="check" id="ed-dedup-bill-row"><input type="checkbox" id="ed-dedup-bill"> เลขที่บิล (1 บิล ใช้ได้ 1 ครั้ง)</label>
				<div class="hint" id="ed-lock-hint"></div>
				<button class="btn btn-ghost btn-sm hidden" id="ed-clear" onclick="clearTestData()">🧹 ล้างข้อมูลทดสอบ (ปลดล็อกการตั้งค่า)</button>
			</div>

			<div class="card">
				<div class="lbl">ของรางวัล</div>
				<div id="ed-gifts"></div>
				<button class="btn btn-outline" onclick="addGiftRow()">+ เพิ่มของรางวัล</button>
				<input type="file" id="ed-file" accept="image/*" class="hidden">
			</div>

		</div>
	</main>

	<div id="modal" class="modal-bg hidden"></div>

	<script>
		// ===== ตั้งค่า Supabase =====
		const SUPABASE_URL = 'https://oosvphgpaduobraeoeir.supabase.co';
		const SUPABASE_KEY = 'sb_publishable_fSjDKNm4HIU5lWTbCo11Dg_3hcjQh-l';
		// ============================

		const LOW_STOCK = 10; // เหลือ ≤ 10 → เตือนสีเหลือง
		const VIEWS = ['view-login', 'view-register', 'view-branch', 'view-staff-pick', 'view-staff', 'view-staff-summary', 'view-admin-list', 'view-admin-users', 'view-admin-audit', 'view-admin-event', 'view-admin-edit'];

		let pin = '';               // session token (ส่งในช่อง p_pin ของทุก API)
		let me = null;              // ผู้ใช้ที่ login อยู่
		let role = null;
		let images = {};            // gift_id → data URL
		const S = { event: null, input: null, branch: null, events: [] }; // staff state (admin ใช้ตอนเข้าหน้าแลก)
		const A = { eventId: null, event: null, tab: 'summary' }; // admin state
		const ED = { event: null, gifts: [], removed: [], pickIdx: null }; // editor state

		/* ---------- utils ---------- */
		function $(id) { return document.getElementById(id); }
		function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
		function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
		function esc(s) {
			return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
				return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
			});
		}
		function money(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
		function showView(id) { VIEWS.forEach(function (v) { $(v).classList.toggle('hidden', v !== id); }); window.scrollTo(0, 0); }
		function staffName() { return me ? me.name : ''; }
		function setErr(msg) { $('err').textContent = msg || ''; }

		async function rpc(fn, args) {
			const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
			if (!SUPABASE_KEY.startsWith('sb_')) headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
			const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
				method: 'POST',
				headers: headers,
				body: JSON.stringify(Object.assign({ p_pin: pin }, args || {}))
			});
			const data = await res.json().catch(function () { return null; });
			if (!res.ok) {
				const err = new Error((data && data.message) || ('เกิดข้อผิดพลาด (' + res.status + ')'));
				err.code = data && data.code;
				throw err;
			}
			return data;
		}

		function handleError(e, target) {
			if (e.code === '28000') { logout(true); $('err-login').textContent = e.message; return; }
			if (e.code === '22023' && role !== 'admin') { showBranchView(e.message); return; }
			if (target) target.textContent = e.message; else alertModal(e.message);
		}

		function alertModal(msg) {
			const m = $('modal');
			m.innerHTML = '<div class="modal"><p>' + esc(msg) + '</p><button class="btn btn-ghost" id="m-ok">ตกลง</button></div>';
			m.classList.remove('hidden');
			$('m-ok').onclick = closeModal;
		}
		function closeModal() { $('modal').classList.add('hidden'); }

		function giftImg(id) {
			return images[id] ? '<img class="gift-img" src="' + images[id] + '" alt="">' : '<div class="gift-ph">🎁</div>';
		}

		async function loadImages(eventId) {
			try { images = await rpc('gift_images', { p_event_id: eventId }); } catch (e) { images = {}; }
		}

		// ข้อความสรุปค่าที่กรอก เช่น "สมาชิก 123 · บิล B001 · ฿500"
		function describeInput(x) {
			const parts = [];
			if (x.memberId) parts.push('สมาชิก ' + esc(x.memberId));
			if (x.billNo) parts.push('บิล ' + esc(x.billNo));
			if (x.billAmount != null) parts.push((x.bills && x.bills.length > 1 ? 'รวม ' : '') + '฿' + money(x.billAmount));
			return parts.join(' · ');
		}

		// ใกล้หมด = เหลือ ≤ 10 หรือ ≤ 20% ของ stock (เอาค่าที่น้อยกว่า) → ของจำนวนน้อยไม่ขึ้นเหลืองตั้งแต่แรก
		function stockClass(g) {
			const lowAt = Math.min(LOW_STOCK, Math.ceil(g.stock * 0.2));
			return g.remaining <= 0 ? 'out' : g.remaining <= lowAt ? 'low' : '';
		}

		/* ---------- login / สมัคร / logout ---------- */
		async function login() {
			const u = $('li-user').value.trim(), p = $('li-pin').value;
			$('err-login').textContent = '';
			if (!u || !p) { $('err-login').textContent = 'กรุณากรอก Username และ PIN'; return; }
			$('btn-login').disabled = true;
			try {
				const r = await rpc('auth_login', { p_username: u, p_pin: p });
				if (!r.ok) { $('err-login').textContent = r.message; }
				else {
					pin = r.token;
					store('gift_token', pin);
					store('gift_user', u);
					$('li-pin').value = '';
					await routeAfterAuth();
				}
			} catch (e) { $('err-login').textContent = e.message; }
			$('btn-login').disabled = false;
		}

		async function doRegister() {
			const err = $('err-register');
			err.textContent = '';
			if ($('rg-pin').value !== $('rg-pin2').value) { err.textContent = 'PIN ทั้ง 2 ช่องไม่ตรงกัน'; return; }
			$('btn-register').disabled = true;
			try {
				await rpc('auth_register', { p_username: $('rg-user').value.trim(), p_display_name: $('rg-name').value.trim(), p_pin: $('rg-pin').value });
				$('li-user').value = $('rg-user').value.trim().toLowerCase();
				['rg-name', 'rg-user', 'rg-pin', 'rg-pin2'].forEach(function (id) { $(id).value = ''; });
				showView('view-login');
				$('err-login').innerHTML = '<span style="color:var(--green)">✅ ส่งคำขอแล้ว รอ Admin อนุมัติ แล้วเข้าสู่ระบบได้เลย</span>';
			} catch (e) { err.textContent = e.message; }
			$('btn-register').disabled = false;
		}

		// หลัง login / เปิดแอปใหม่: Admin → หน้า Admin, User → สาขาที่เลือกไว้ / ใส่รหัสสาขา
		async function routeAfterAuth() {
			const r = await rpc('auth_me');
			me = r.user;
			role = me.role === 'admin' ? 'admin' : 'staff';
			if (role === 'admin') return startAdmin();
			if (r.branchCode) {
				try {
					const a = await rpc('app_login');
					return enterBranch(a);
				} catch (e) { return showBranchView(e.code === '22023' ? e.message : ''); }
			}
			showBranchView();
		}

		function logout(silent) {
			if (pin && !silent) rpc('auth_logout').catch(function () {});
			store('gift_token', null);
			pin = ''; role = null; me = null; images = {};
			$('hdr-staff').classList.add('hidden');
			$('hdr-admin').classList.add('hidden');
			$('btn-summary').classList.remove('on');
			$('hdr-title').innerHTML = '🎁 แลกของแถม';
			S.event = null; S.events = []; S.branch = null;
			closeModal();
			$('li-user').value = load('gift_user');
			$('err-login').textContent = '';
			showView('view-login');
		}

		/* ---------- user: ใส่รหัสสาขา ---------- */
		function showBranchView(msg) {
			$('hdr-title').innerHTML = '🎁 แลกของแถม<small>' + esc(me ? me.name : '') + '</small>';
			$('hdr-staff').classList.add('hidden');
			$('hdr-admin').classList.remove('hidden');
			$('err-branch').textContent = msg || '';
			$('br-code').value = S.branch || '';
			showView('view-branch');
		}

		async function submitBranch() {
			const code = $('br-code').value.trim();
			$('err-branch').textContent = '';
			if (!code) { $('err-branch').textContent = 'กรุณาใส่รหัสสาขา'; return; }
			$('btn-branch').disabled = true;
			try { enterBranch(await rpc('session_set_branch', { p_branch: code })); }
			catch (e) { if (e.code === '28000') handleError(e); else $('err-branch').textContent = e.message; }
			$('btn-branch').disabled = false;
		}

		function enterBranch(a) {
			S.branch = a.branchCode;
			S.events = a.events;
			if (a.events.length === 1) startStaff(a.events[0]);
			else showEventPicker();
		}

		/* ---------- เปลี่ยน PIN ของตัวเอง ---------- */
		function openChangePin() {
			const m = $('modal');
			m.innerHTML = '<div class="modal" style="text-align:left"><h3 style="margin-top:0">เปลี่ยน PIN ของฉัน</h3>' +
				'<div class="field"><label>PIN เดิม</label><input id="cp-old" class="sm-input" type="password"></div>' +
				'<div class="field"><label>PIN ใหม่ (4-20 ตัว)</label><input id="cp-new" class="sm-input" type="password"></div>' +
				'<div class="field"><label>ยืนยัน PIN ใหม่</label><input id="cp-new2" class="sm-input" type="password"></div>' +
				'<div class="err" id="cp-err"></div>' +
				'<div class="btns"><button class="btn btn-ghost" id="m-cancel">ยกเลิก</button><button class="btn btn-primary" id="m-ok">บันทึก</button></div>' +
				'<div class="hint">เปลี่ยนแล้ว เครื่องอื่นที่ login ไว้จะถูกออกจากระบบ</div></div>';
			m.classList.remove('hidden');
			$('m-cancel').onclick = closeModal;
			$('m-ok').onclick = async function () {
				if ($('cp-new').value !== $('cp-new2').value) { $('cp-err').textContent = 'PIN ใหม่ 2 ช่องไม่ตรงกัน'; return; }
				$('m-ok').disabled = true;
				try {
					await rpc('auth_change_pin', { p_old_pin: $('cp-old').value, p_new_pin: $('cp-new').value });
					closeModal(); alertModal('เปลี่ยน PIN แล้ว');
				} catch (e) { $('cp-err').textContent = e.message; $('m-ok').disabled = false; }
			};
		}

		/* ---------- staff: เลือก Event ---------- */
		async function showEventPicker() {
			// โหลดรายการใหม่ทุกครั้ง เผื่อ Admin เพิ่ม/ปิด Event ระหว่างวัน
			try { const r = await rpc('app_login'); S.events = r.events; S.branch = r.branchCode; }
			catch (e) { handleError(e); return; }
			$('hdr-title').innerHTML = '🎁 แลกของแถม<small>สาขา ' + esc(S.branch) + ' · ' + esc(me ? me.name : '') + '</small>';
			$('hdr-staff').classList.add('hidden');
			$('hdr-admin').classList.remove('hidden');
			$('pick-title').textContent = 'สาขา ' + S.branch + ' มี ' + S.events.length + ' Event ที่เปิดอยู่ — เลือก Event';
			$('pick-list').innerHTML = S.events.map(function (e) {
				const fields = [e.useMember ? 'รหัสสมาชิก' : null, e.useBillNo ? 'เลขที่บิล' : null, e.useBillAmount ? 'ยอดบิล' : null, e.useNote ? 'หมายเหตุ' : null, e.usePhotos ? 'รูป' : null].filter(Boolean).join(', ');
				return '<button class="ev-card" data-id="' + e.id + '"><div class="t">' + esc(e.name) + '</div>' +
					'<div class="s">กรอก: ' + esc(fields) + (e.minBillAmount != null ? ' · ขั้นต่ำ ฿' + money(e.minBillAmount) : '') + '</div></button>';
			}).join('');
			$('pick-list').querySelectorAll('.ev-card').forEach(function (b) {
				const ev = S.events.filter(function (x) { return x.id === Number(b.dataset.id); })[0];
				b.addEventListener('click', function () { $('hdr-admin').classList.add('hidden'); startStaff(ev); });
			});
			showView('view-staff-pick');
		}

		/* ---------- admin: เข้าหน้าแลกของ Event ที่เลือก ---------- */
		async function adminRedeem() {
			$('hdr-admin').classList.add('hidden');
			await startStaff(A.event);
		}

		function backToAdmin() {
			$('hdr-staff').classList.add('hidden');
			$('hdr-admin').classList.remove('hidden');
			$('btn-summary').classList.remove('on');
			$('hdr-title').innerHTML = '🎁 แลกของแถม<small>Admin · ' + esc(me.name) + '</small>';
			A.tab = 'log';
			openAdminEvent(S.event.id);
		}

		/* =====================================================
		   STAFF
		   ===================================================== */
		async function startStaff(event) {
			S.event = event;
			$('hdr-title').innerHTML = '🎁 ' + esc(event.name) + '<small>สาขา ' + esc(event.branchCode) + ' · ' + esc(me ? me.name : '') + '</small>';
			$('hdr-staff').classList.remove('hidden');
			$('hdr-admin').classList.add('hidden');
			const isAdmin = role === 'admin';
			$('btn-back-admin').classList.toggle('hidden', !isAdmin);
			$('btn-switch').classList.toggle('hidden', isAdmin);
			['btn-summary', 'btn-csv-staff', 'btn-logout-staff'].forEach(function (id) { $(id).classList.toggle('hidden', isAdmin); });
			$('btn-summary').classList.remove('on');
			$('staff-who').textContent = 'ผู้บันทึก: ' + staffName() + ' (บันทึกอัตโนมัติจากบัญชีที่เข้าสู่ระบบ)';
			buildInputFields();
			showView('view-staff');
			resetStaff();
			await loadImages(event.id);
			await loadStaffDashboard();
		}

		function usesBills(e) { return e.useBillNo || e.useBillAmount; }

		function buildInputFields() {
			const e = S.event, f = [];
			if (e.useMember) f.push('<div class="field"><label>รหัสสมาชิก</label><input id="in-member" inputmode="numeric" autocomplete="off" placeholder="กรอกรหัสสมาชิก"></div>');
			if (usesBills(e)) {
				const head = (e.useBillNo ? '<span>เลขที่บิล</span>' : '') + (e.useBillAmount ? '<span class="num">ยอด (บาท)</span>' : '') + '<span></span>';
				f.push('<div class="field"><div class="bill-head ' + billCols(e) + '">' + head + '</div>' +
					'<div id="bill-rows"></div>' +
					'<button type="button" class="btn btn-outline btn-sm" onclick="addBillRow(true)">+ เพิ่มบิล</button>' +
					(e.useBillAmount ? '<div class="bill-total"><span>Total</span><b id="bill-total">฿0</b></div>' +
						(e.minBillAmount != null ? '<div class="hint" id="bill-min">ขั้นต่ำ ฿' + money(e.minBillAmount) + '</div>' : '') : '') +
					'</div>');
			}
			if (e.useNote) f.push('<div class="field"><label>หมายเหตุ</label><textarea id="in-note" rows="2" placeholder="ไม่บังคับ"></textarea></div>');
			if (e.usePhotos) f.push('<div class="field"><label>รูปถ่าย (แนบได้หลายรูป)</label>' +
				'<div class="photo-grid" id="photo-grid"></div>' +
				'<button type="button" class="btn btn-outline btn-sm" onclick="$(\'in-photo-file\').click()">📷 ถ่าย / เลือกรูป</button>' +
				'<input type="file" id="in-photo-file" accept="image/*" multiple class="hidden"></div>');
			$('input-fields').innerHTML = f.join('');

			S.photos = [];
			if (usesBills(e)) addBillRow(false);
			if (e.usePhotos) {
				$('in-photo-file').addEventListener('change', async function () {
					const files = Array.prototype.slice.call(this.files || []);
					this.value = '';
					for (let i = 0; i < files.length; i++) {
						try { S.photos.push(await resizeImage(files[i], 1280, 650000)); }
						catch (err) { setErr('เปิดรูปไม่ได้: ' + files[i].name); }
					}
					renderPhotoGrid();
				});
				renderPhotoGrid();
			}
			if ($('in-member')) bindEnter($('in-member'));
		}

		function billCols(e) { return e.useBillNo && e.useBillAmount ? 'c2' : 'c1'; }

		// Enter → ช่องถัดไป (สมาชิก → บิลแรก → ยอด → บิลถัดไป ...) / ตรวจสอบ
		function bindEnter(inp) {
			inp.addEventListener('keydown', function (ev) {
				if (ev.key !== 'Enter') return;
				ev.preventDefault();
				const all = Array.prototype.slice.call($('input-fields').querySelectorAll('#in-member, .bill-no, .bill-amt'));
				const i = all.indexOf(inp);
				if (i >= 0 && i < all.length - 1) all[i + 1].focus(); else check();
			});
		}

		function addBillRow(focus) {
			const e = S.event;
			const row = document.createElement('div');
			row.className = 'bill-row ' + billCols(e);
			row.innerHTML = (e.useBillNo ? '<input class="bill-no sm-input" autocomplete="off" autocapitalize="characters" placeholder="เลขที่บิล">' : '') +
				(e.useBillAmount ? '<input class="bill-amt sm-input" inputmode="decimal" autocomplete="off" placeholder="0.00">' : '') +
				'<button type="button" class="bill-del" title="ลบแถว">✕</button>';
			$('bill-rows').appendChild(row);
			row.querySelectorAll('input').forEach(bindEnter);
			const amt = row.querySelector('.bill-amt');
			if (amt) amt.addEventListener('input', updateBillTotal);
			row.querySelector('.bill-del').addEventListener('click', function () {
				if ($('bill-rows').children.length <= 1) { row.querySelectorAll('input').forEach(function (i) { i.value = ''; }); }
				else row.remove();
				updateBillTotal();
				syncBillDel();
			});
			syncBillDel();
			if (focus) row.querySelector('input').focus();
		}

		function syncBillDel() {
			const rows = $('bill-rows').children;
			Array.prototype.forEach.call(rows, function (r) { r.querySelector('.bill-del').style.visibility = rows.length > 1 ? 'visible' : 'hidden'; });
		}

		function parseAmount(v) {
			const t = String(v || '').replace(/[,\s]/g, '');
			return /^\d+(\.\d{1,2})?$/.test(t) ? Number(t) : null;
		}

		function updateBillTotal() {
			if (!$('bill-total')) return;
			let total = 0;
			$('bill-rows').querySelectorAll('.bill-amt').forEach(function (i) { total += parseAmount(i.value) || 0; });
			$('bill-total').textContent = '฿' + money(total);
			const min = S.event.minBillAmount;
			if ($('bill-min')) $('bill-min').classList.toggle('ok-text', min != null && total >= min);
		}

		function renderPhotoGrid() {
			$('photo-grid').innerHTML = S.photos.map(function (p, i) {
				return '<div class="ph"><img src="' + p + '" alt=""><button type="button" data-i="' + i + '">✕</button></div>';
			}).join('');
			$('photo-grid').querySelectorAll('button').forEach(function (b) {
				b.addEventListener('click', function () { S.photos.splice(Number(b.dataset.i), 1); renderPhotoGrid(); });
			});
		}

		function readInput() {
			const bills = [];
			if ($('bill-rows')) {
				$('bill-rows').querySelectorAll('.bill-row').forEach(function (r) {
					const no = r.querySelector('.bill-no'), amt = r.querySelector('.bill-amt');
					const b = { billNo: no ? no.value.trim() : null, amount: amt ? amt.value.trim() : null };
					if ((b.billNo || '') !== '' || (b.amount || '') !== '') bills.push(b);
				});
			}
			return {
				member: $('in-member') ? $('in-member').value.trim() : null,
				bills: bills,
				note: $('in-note') ? $('in-note').value.trim() : null
			};
		}

		async function refreshStaff() {
			if (!$('view-staff-summary').classList.contains('hidden')) return loadStaffSummary();
			await loadImages(S.event.id);
			loadStaffDashboard();
		}

		async function loadStaffDashboard() {
			try {
				const d = await rpc('event_dashboard', { p_event_id: S.event.id });
				S.event = d.event;
				renderStock($('stock'), d.gifts);
				renderRecent($('recent'), d.recent, false, S.event.id);
			} catch (e) { handleError(e, $('err')); }
		}

		function renderStock(el, gifts) {
			if (!gifts.length) { el.innerHTML = '<div class="muted">ยังไม่มีของรางวัล</div>'; return; }
			el.innerHTML = gifts.map(function (g) {
				const cls = stockClass(g);
				const badge = cls === 'out' ? '<span class="badge">หมดแล้ว</span>' : cls === 'low' ? '<span class="badge">ใกล้หมด</span>' : '';
				return '<div class="' + cls + '">' + giftImg(g.id) + '<small>' + esc(g.name) + '</small><b>' + g.remaining + '</b>' +
					'<small>จาก ' + g.stock + ' (แลกแล้ว ' + g.used + ')</small>' + (badge ? '<br>' + badge : '') + '</div>';
			}).join('');
		}

		function renderRecent(el, rows, canVoid, eventId) {
			if (!rows.length) { el.innerHTML = '<div class="muted">ยังไม่มีรายการ</div>'; return; }
			el.innerHTML = rows.map(function (x) {
				const tag = x.status === 'REDEEMED' ? '<span class="tag r">รับ</span>'
					: x.status === 'DUPLICATE_ATTEMPT' ? '<span class="tag d">ซ้ำ</span>'
					: '<span class="tag v">ยกเลิก</span>';
				const icons = (x.photoCount ? ' 📷' + x.photoCount : '') + (x.note ? ' 📝' : '');
				const voidBtn = canVoid && x.status === 'REDEEMED' ? '<button class="btn-void" data-id="' + x.id + '">ยกเลิก</button>' : '';
				return '<div class="row clickable' + (x.status === 'VOID' ? ' voided' : '') + '" data-id="' + x.id + '"><span>' + tag + ' <span class="txt">' + describeInput(x) + ' → ' + esc(x.giftName) + '</span>' + icons + '</span>' +
					'<span class="meta">' + esc(x.ts.slice(11, 16)) + voidBtn + '</span></div>';
			}).join('');
			el.querySelectorAll('.row').forEach(function (r) {
				r.addEventListener('click', function (ev) {
					if (ev.target.closest('.btn-void')) return;
					openDetail(eventId, Number(r.dataset.id), canVoid);
				});
			});
			if (canVoid) {
				el.querySelectorAll('.btn-void').forEach(function (b) {
					const row = rows.filter(function (r) { return r.id === Number(b.dataset.id); })[0];
					b.addEventListener('click', function () { confirmVoid(row); });
				});
			}
		}

		/* ---------- รายละเอียด 1 รายการ (บิล / หมายเหตุ / รูป) ---------- */
		async function openDetail(eventId, redemptionId, canVoid) {
			const m = $('modal');
			m.innerHTML = '<div class="modal detail"><p class="muted">กำลังโหลด...</p></div>';
			m.classList.remove('hidden');
			try {
				const d = await rpc('redemption_detail', { p_event_id: eventId, p_redemption_id: redemptionId });
				const r = d.redemption;
				const statusTxt = r.status === 'REDEEMED' ? '<span class="tag r">รับ</span>'
					: r.status === 'DUPLICATE_ATTEMPT' ? '<span class="tag d">พยายามแลกซ้ำ (' + (r.matchedBy === 'bill' ? 'บิล ' : 'สมาชิก ') + esc(r.matchedKey || '') + ')</span>'
					: '<span class="tag v">ยกเลิกแล้ว</span>';
				const showAmt = r.bills.some(function (b) { return b.amount != null; });
				m.innerHTML = '<div class="modal detail"><div class="row-between"><b>รายละเอียด</b><button class="chip g" id="m-close">ปิด</button></div>' +
					'<div style="margin:8px 0 4px">' + statusTxt + '</div>' +
					(r.memberId ? '<div class="kv"><span>รหัสสมาชิก</span><b>' + esc(r.memberId) + '</b></div>' : '') +
					'<div class="kv"><span>ของรางวัล</span><b>' + esc(r.giftName || '-') + '</b></div>' +
					'<div class="kv"><span>เวลา</span><span>' + esc(r.ts) + '</span></div>' +
					(r.staff ? '<div class="kv"><span>พนักงาน</span><span>' + esc(r.staff) + '</span></div>' : '') +
					(r.status === 'VOID' ? '<div class="kv"><span>ยกเลิกโดย</span><span>' + esc(r.voidedBy) + ' · ' + esc(r.voidedAt) + '</span></div>' : '') +
					billsTable(r.bills, showAmt, false) +
					(r.note ? '<div class="note-box">📝 ' + esc(r.note) + '</div>' : '') +
					(d.photos.length ? '<div class="lbl" style="margin-top:10px">รูปถ่าย ' + d.photos.length + ' รูป (แตะเพื่อขยาย)</div><div class="detail-photos">' +
						d.photos.map(function (p) { return '<img src="' + p.image + '" alt="">'; }).join('') + '</div>' : '') +
					(canVoid && r.status === 'REDEEMED' ? '<button class="btn btn-danger" id="m-void">ยกเลิกรายการนี้</button>' : '') +
					'</div>';
				$('m-close').onclick = closeModal;
				m.querySelectorAll('.detail-photos img').forEach(function (img) {
					img.addEventListener('click', function () { showPhoto(img.src); });
				});
				if ($('m-void')) $('m-void').onclick = function () { confirmVoid(r); };
			} catch (e) { closeModal(); handleError(e); }
		}

		function showPhoto(src) {
			const v = document.createElement('div');
			v.className = 'photo-view';
			v.innerHTML = '<img src="' + src + '" alt="">';
			v.addEventListener('click', function () { v.remove(); });
			document.body.appendChild(v);
		}

		async function check() {
			const inp = readInput();
			setErr('');
			const btn = $('btn-check');
			btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
			try {
				const res = await rpc('staff_check', { p_event_id: S.event.id, p_member_id: inp.member, p_bills: inp.bills, p_staff: staffName() });
				if (!res.ok) setErr(res.message);
				else if (res.duplicate) showDuplicate(res.prev, res.matchedBy, res.attempts, res.matchedKey);
				else { S.input = res.input; S.note = inp.note; showChoices(res.gifts); }
				loadStaffDashboard();
			} catch (e) { handleError(e, $('err')); }
			btn.disabled = false; btn.textContent = 'ตรวจสอบ';
		}

		function showResult(html) {
			$('step-input').classList.add('hidden');
			$('step-result').innerHTML = html + '<button class="btn btn-ghost" onclick="resetStaff()">คนต่อไป</button>';
			$('step-result').classList.remove('hidden');
		}

		function showDuplicate(prev, matchedBy, attempts, matchedKey) {
			const what = matchedBy === 'bill' ? 'บิล ' + esc(matchedKey || '') + ' ใช้แลกไปแล้ว' : 'สมาชิกนี้รับไปแล้ว';
			showResult(
				'<div class="result dup"><h2>❌ ' + what + '</h2>' +
				'<p>' + describeInput(prev) + '</p>' + giftImg(prev.giftId) +
				'<p>รับ <b>' + esc(prev.giftName) + '</b></p>' +
				'<p>เมื่อ ' + esc(prev.ts) + '</p>' +
				(prev.staff ? '<p>โดย ' + esc(prev.staff) + '</p>' : '') +
				(attempts ? '<p class="note">พยายามแลกซ้ำครั้งที่ ' + attempts + '</p>' : '') + '</div>'
			);
		}

		function showChoices(gifts) {
			const btns = gifts.map(function (g) {
				return '<button class="gift-btn" data-id="' + g.id + '"' + (g.remaining <= 0 ? ' disabled' : '') + '>' + giftImg(g.id) +
					'<div class="n">' + esc(g.name) + '</div>' +
					'<div class="r">' + (g.remaining <= 0 ? 'หมดแล้ว' : 'เหลือ ' + g.remaining + ' ชิ้น') + '</div></button>';
			}).join('');
			$('step-input').classList.add('hidden');
			$('step-result').innerHTML = '<div class="card"><label>✅ ' + describeInput(S.input) + ' — เลือกของรางวัล</label>' +
				(gifts.length ? '<div class="gift-grid">' + btns + '</div>' : '<div class="muted">Event นี้ยังไม่มีของรางวัล</div>') +
				'<button class="btn btn-ghost" onclick="resetStaff()">ยกเลิก</button></div>';
			$('step-result').classList.remove('hidden');
			$('step-result').querySelectorAll('.gift-btn').forEach(function (b) {
				const g = gifts.filter(function (x) { return x.id === Number(b.dataset.id); })[0];
				b.addEventListener('click', function () { confirmGift(g); });
			});
		}

		function confirmGift(g) {
			const m = $('modal');
			const extra = (S.note ? '<br><span class="muted">📝 ' + esc(S.note) + '</span>' : '') +
				(S.photos && S.photos.length ? '<br><span class="muted">📷 ' + S.photos.length + ' รูป</span>' : '');
			m.innerHTML = '<div class="modal"><h3 style="margin-top:0">ยืนยันการแลก</h3>' +
				'<p>' + describeInput(S.input) + '<br>รับ <b>' + esc(g.name) + '</b>' + extra + '</p>' +
				'<div class="btns"><button class="btn btn-ghost" id="m-cancel">ยกเลิก</button>' +
				'<button class="btn btn-primary" id="m-ok">ยืนยัน</button></div></div>';
			m.classList.remove('hidden');
			$('m-cancel').onclick = closeModal;
			$('m-ok').onclick = function () { doRedeem(g); };
		}

		async function doRedeem(g) {
			const btn = $('m-ok');
			btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
			try {
				const res = await rpc('staff_redeem', {
					p_event_id: S.event.id,
					p_member_id: S.input.memberId,
					p_bills: S.input.bills,
					p_gift_id: g.id, p_staff: staffName(),
					p_note: S.note || null
				});
				closeModal();
				if (res.ok) {
					const r = res.redemption;
					showResult('<div class="result ok"><h2>✅ แลกสำเร็จ</h2>' +
						(r.memberId ? '<p>สมาชิก ' + esc(r.memberId) + '</p>' : '') + giftImg(r.giftId) +
						'<p>รับ <b>' + esc(r.giftName) + '</b></p><p>' + esc(r.ts) + '</p>' +
						billsTable(r.bills, S.event.useBillAmount, true) +
						(r.note ? '<p style="font-size:14px">📝 ' + esc(r.note) + '</p>' : '') +
						'<div id="photo-status"></div>' +
						'<p style="font-size:13px">เหลือ ' + res.remaining + ' ชิ้น</p>' +
						'<p class="note">' + (role === 'admin' ? 'กดผิด? ยกเลิกได้ที่ ← Admin › รายการ' : 'กดผิด? แจ้ง Admin ให้ยกเลิกรายการ') + '</p></div>');
					if (S.photos && S.photos.length) uploadPhotos(r.id, S.photos.slice());
				} else if (res.reason === 'DUPLICATE') {
					showDuplicate(res.prev, res.matchedBy, 0, res.matchedKey);
				} else if (res.reason === 'OUT_OF_STOCK') {
					showResult('<div class="result warn"><h2>⚠️ ' + esc(res.gift.name) + ' หมดแล้ว</h2><p>ให้ลูกค้าเลือกอย่างอื่น</p></div>');
				} else {
					showResult('<div class="result warn"><h2>⚠️ ' + esc(res.message || 'ข้อมูลไม่ถูกต้อง') + '</h2></div>');
				}
				loadStaffDashboard();
			} catch (e) { closeModal(); handleError(e, $('err')); }
		}

		// อัปโหลดรูปทีละรูปหลังแลกสำเร็จ (ไม่สำเร็จ → กดลองใหม่ได้)
		async function uploadPhotos(redemptionId, photos) {
			const box = $('photo-status');
			const failed = [];
			for (let i = 0; i < photos.length; i++) {
				if (box) box.innerHTML = '<p style="font-size:14px">📷 กำลังอัปโหลดรูป ' + (i + 1) + '/' + photos.length + '...</p>';
				try { await rpc('staff_add_photo', { p_event_id: S.event.id, p_redemption_id: redemptionId, p_image: photos[i] }); }
				catch (e) { failed.push(photos[i]); }
			}
			if (!box) return;
			if (!failed.length) { box.innerHTML = '<p style="font-size:14px">📷 แนบรูปแล้ว ' + photos.length + ' รูป</p>'; return; }
			box.innerHTML = '<p style="font-size:14px">⚠️ อัปโหลดไม่สำเร็จ ' + failed.length + ' รูป</p>' +
				'<button class="btn btn-void-lg" id="btn-retry-photo">ลองอัปโหลดอีกครั้ง</button>';
			$('btn-retry-photo').onclick = function () { uploadPhotos(redemptionId, failed); };
		}

		// ตารางบิล: ซ้ายเลขที่บิล ขวายอด + Total
		function billsTable(bills, showAmount, onDark) {
			if (!bills || !bills.length) return '';
			let total = 0;
			const rows = bills.map(function (b) {
				total += Number(b.amount || 0);
				return '<tr><td>' + esc(b.billNo || '-') + '</td>' + (showAmount ? '<td class="num">฿' + money(b.amount) + '</td>' : '') + '</tr>';
			}).join('');
			return '<table class="bills-tbl' + (onDark ? ' on-dark' : '') + '">' + rows +
				(showAmount ? '<tr class="tot"><td>Total</td><td class="num">฿' + money(total) + '</td></tr>' : '') + '</table>';
		}

		function resetStaff() {
			S.input = null; S.note = null;
			$('step-result').classList.add('hidden');
			$('step-input').classList.remove('hidden');
			buildInputFields();
			const first = $('input-fields').querySelector('input');
			if (first) first.focus();
			setErr('');
		}

		function toggleStaffSummary() {
			const showing = !$('view-staff-summary').classList.contains('hidden');
			$('btn-summary').classList.toggle('on', !showing);
			if (showing) { showView('view-staff'); loadStaffDashboard(); }
			else { showView('view-staff-summary'); loadStaffSummary(); }
		}

		async function loadStaffSummary() {
			$('staff-summary-body').innerHTML = '<div class="card muted">กำลังโหลด...</div>';
			try { renderSummary($('staff-summary-body'), await rpc('event_summary', { p_event_id: S.event.id })); }
			catch (e) { handleError(e); }
		}

		/* =====================================================
		   SUMMARY (ใช้ทั้ง staff / admin)
		   ===================================================== */
		function renderSummary(el, s) {
			const t = s.totals, ev = s.event;
			const remainingTotal = s.gifts.filter(function (g) { return g.isActive; }).reduce(function (a, g) { return a + g.remaining; }, 0);
			let html = '<div class="card"><label>ภาพรวม</label><div class="sum-grid">' +
				'<div><b>' + t.redeemed + '</b><small>แจกแล้ว</small></div>' +
				'<div class="red"><b>' + t.duplicateAttempts + '</b><small>พยายามแลกซ้ำ</small></div>' +
				'<div><b>' + t.voided + '</b><small>ยกเลิกรายการ</small></div>' +
				'<div><b>' + remainingTotal + '</b><small>ของคงเหลือรวม</small></div>' +
				(ev.useBillAmount ? '<div style="grid-column:1/-1"><b>฿' + money(t.billTotal) + '</b><small>ยอดบิลรวม (เฉพาะที่แจกจริง' + (t.billCount ? ' · ' + t.billCount + ' บิล' : '') + ')</small></div>' : '') +
				'</div></div>';

			html += '<div class="card"><label>ของรางวัล</label>' + (s.gifts.length ? '<table class="sum">' + s.gifts.map(function (g) {
				const pct = g.stock ? Math.round(g.used / g.stock * 100) : 0;
				return '<tr><td>' + esc(g.name) + (g.isActive ? '' : ' <span class="muted">(ซ่อน)</span>') + '</td>' +
					'<td style="width:40%"><div class="bar-wrap"><div class="bar" style="width:' + pct + '%"></div></div></td>' +
					'<td class="num">' + g.used + '/' + g.stock + '</td></tr>';
			}).join('') + '</table>' : '<div class="muted">ยังไม่มีของรางวัล</div>') + '</div>';

			const maxH = Math.max.apply(null, s.hourly.map(function (h) { return h.redeemed; }).concat([1]));
			html += '<div class="card"><label>รายชั่วโมง</label>' + (s.hourly.length ?
				'<table class="sum"><tr><th>ชั่วโมง</th><th></th><th class="num">แจก</th><th class="num">ซ้ำ</th></tr>' +
				s.hourly.map(function (h) {
					return '<tr><td style="white-space:nowrap">' + esc(h.hour) + '</td>' +
						'<td style="width:45%"><div class="bar-wrap"><div class="bar" style="width:' + Math.round(h.redeemed / maxH * 100) + '%"></div></div></td>' +
						'<td class="num">' + h.redeemed + '</td><td class="num" style="color:var(--red)">' + (h.duplicateAttempts || '') + '</td></tr>';
				}).join('') + '</table>' : '<div class="muted">ยังไม่มีข้อมูล</div>') + '</div>';

			html += '<div class="card"><label>รายพนักงาน</label>' + (s.byStaff.length ?
				'<table class="sum"><tr><th>พนักงาน</th><th class="num">แจก</th><th class="num">ยกเลิก</th><th class="num">จับซ้ำได้</th></tr>' +
				s.byStaff.map(function (r) {
					return '<tr><td>' + esc(r.staff) + '</td><td class="num">' + r.handedOut + '</td><td class="num">' + (r.voided || '') + '</td>' +
						'<td class="num" style="color:var(--red)">' + (r.duplicateCaught || '') + '</td></tr>';
				}).join('') + '</table>' : '<div class="muted">ยังไม่มีข้อมูล</div>') + '</div>';

			html += '<div class="card"><label>พยายามแลกซ้ำ</label>' + (s.duplicates.length ?
				s.duplicates.map(function (d) {
					const p = d.prev || {};
					return '<div class="dup-item"><b>' + (d.matchedBy === 'bill' ? 'บิล ' : 'สมาชิก ') + esc(d.key) + '</b> <span class="times">×' + d.attempts + '</span><br>' +
						'<span class="muted">รับ ' + esc(p.giftName || '-') + ' เมื่อ ' + esc(p.ts || '-') + (p.staff ? ' โดย ' + esc(p.staff) : '') + '</span><br>' +
						'<span class="muted">มาแลกซ้ำล่าสุด ' + esc(d.lastAttempt) + '</span></div>';
				}).join('') : '<div class="muted">ยังไม่มีคนแลกซ้ำ 👍</div>') + '</div>';

			el.innerHTML = html;
		}

		/* =====================================================
		   CSV (staff = Event ตัวเอง, admin = Event ที่เลือก)
		   ===================================================== */
		async function exportCsv(eventId) {
			try {
				const d = await rpc('event_export', { p_event_id: eventId });
				const head = ['timestamp', 'member_id', 'bill_no', 'bill_total', 'bill_count', 'bills_detail', 'gift', 'staff', 'status', 'matched_by', 'matched_key', 'note', 'photo_count', 'voided_at', 'voided_by'];
				const q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
				const t = function (v) { return v ? '="' + String(v).replace(/"/g, '') + '"' : ''; }; // กัน Excel ตัด 0 นำหน้า
				const lines = d.rows.map(function (r) {
					// bills_detail = เลขบิล:ยอด | เลขบิล:ยอด
					const detail = (r.bills || []).map(function (b) { return (b.billNo || '-') + (b.amount != null ? ':' + b.amount : ''); }).join(' | ');
					return [q(r.ts), t(r.memberId), t(r.billNo), r.billAmount == null ? '' : r.billAmount, (r.bills || []).length || '', q(detail), q(r.giftName), q(r.staff), q(r.status), q(r.matchedBy), q(r.matchedKey), q(r.note), r.photoCount || '', q(r.voidedAt), q(r.voidedBy)].join(',');
				});
				const csv = '﻿' + head.join(',') + '\n' + lines.join('\n');
				const a = document.createElement('a');
				a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
				const now = new Date();
				a.download = (d.event.branchCode + '_' + d.event.name).replace(/[\\/:*?"<>|\s]+/g, '_') + '_' +
					now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '.csv';
				a.click();
			} catch (e) { handleError(e); }
		}

			};

				return '<div class="u-row">' + head(u) + '<div class="s">สมัครเมื่อ ' + esc(u.createdAt) + '</div>' +
					'<div class="acts"><button class="chip ok" data-act="approve-user" data-id="' + u.id + '">✓ อนุมัติเป็น User</button>' +
					'<button class="chip ok" data-act="approve-admin" data-id="' + u.id + '">✓ อนุมัติเป็น Admin</button>' +

			}).join('') : '<div class="muted">ไม่มีคำขอ</div>') + '</div>';

			html += '<div class="card"><label>ใช้งานอยู่ (' + active.length + ' · Admin ' + nAdmin + ')</label>' + active.map(function (u) {
				const self = me && u.id === me.id;
				return '<div class="u-row">' + head(u) + '<div class="s">' + (u.lastLoginAt ? 'เข้าใช้ล่าสุด ' + esc(u.lastLoginAt) : 'ยังไม่เคยเข้าใช้') +
					(u.approvedBy ? ' · อนุมัติโดย ' + esc(u.approvedBy) : '') + (self ? ' · (คุณ)' : '') + '</div>' +
					(self ? '' : '<div class="acts">' +
						(u.role === 'admin' ? '<button class="chip g" data-act="to-user" data-id="' + u.id + '">เปลี่ยนเป็น User</button>'
							: '<button class="chip g" data-act="to-admin" data-id="' + u.id + '">เปลี่ยนเป็น Admin</button>') +
						'<button class="chip g" data-act="reset" data-id="' + u.id + '">🔑 รีเซ็ต PIN</button>' +
						'<button class="chip" data-act="disable" data-id="' + u.id + '">ระงับ</button></div>') + '</div>';
			}).join('') + '</div>';

			if (disabled.length) {
				html += '<div class="card"><label>ระงับแล้ว (' + disabled.length + ')</label>' + disabled.map(function (u) {
					return '<div class="u-row">' + head(u) + '<div class="acts"><button class="chip ok" data-act="enable" data-id="' + u.id + '">เปิดใช้อีกครั้ง</button></div></div>';
				}).join('') + '</div>';

				const u = users.filter(function (x) { return x.id === Number(b.dataset.id); })[0];

		async function userAction(act, u) {
			const set = async function (status, roleName) {
				try { await rpc('admin_set_user', { p_user_id: u.id, p_status: status, p_role: roleName }); showUsers(); }
				catch (e) { handleError(e); }
			};
			if (act === 'approve-user') return set('active', 'user');
			if (act === 'approve-admin') return confirmBox('อนุมัติ ' + u.name + ' เป็น Admin?', 'Admin สร้าง/แก้ Event, ยกเลิกรายการ และจัดการผู้ใช้ได้', function () { set('active', 'admin'); });
			if (act === 'reject') return confirmBox('ปฏิเสธคำขอของ ' + u.name + '?', '', function () { set('disabled', u.role); });
			if (act === 'to-admin') return confirmBox('เปลี่ยน ' + u.name + ' เป็น Admin?', '', function () { set('active', 'admin'); });
			if (act === 'to-user') return confirmBox('เปลี่ยน ' + u.name + ' เป็น User?', '', function () { set('active', 'user'); });
			if (act === 'disable') return confirmBox('ระงับ ' + u.name + '?', 'จะถูกออกจากระบบทันที และเข้าใช้ไม่ได้จนกว่าจะเปิดใหม่', function () { set('disabled', u.role); });
			if (act === 'enable') return set('active', u.role);
			if (act === 'reset') {
				const m = $('modal');
				m.innerHTML = '<div class="modal" style="text-align:left"><h3 style="margin-top:0">รีเซ็ต PIN: ' + esc(u.name) + '</h3>' +
					'<div class="field"><label>PIN ใหม่ (4-20 ตัว)</label><input id="rp-new" class="sm-input" type="text" autocomplete="off"></div>' +
					'<div class="err" id="rp-err"></div><div class="hint">แจ้ง PIN ใหม่ให้เจ้าของบัญชี แล้วให้เปลี่ยนเองภายหลัง</div>' +
					'<div class="btns"><button class="btn btn-ghost" id="m-cancel">ยกเลิก</button><button class="btn btn-primary" id="m-ok">รีเซ็ต</button></div></div>';
				m.classList.remove('hidden');
				$('m-cancel').onclick = closeModal;
				$('m-ok').onclick = async function () {
					try { await rpc('admin_reset_pin', { p_user_id: u.id, p_new_pin: $('rp-new').value }); closeModal(); alertModal('รีเซ็ต PIN ของ ' + u.name + ' แล้ว'); }
					catch (e) { $('rp-err').textContent = e.message; }
				};
			}
		}

			m.innerHTML = '<div class="modal"><h3 style="margin-top:0">' + esc(title) + '</h3>' + (sub ? '<p class="muted" style="font-size:13px">' + esc(sub) + '</p>' : '') +

		/* ---------- ADMIN: ประวัติ (ใครทำอะไร) ---------- */
		async function showAudit() {
			showView('view-admin-audit');

			try {
				let rows = await rpc('admin_audit_log', { p_event_id: null, p_limit: 300 });

				renderAudit($('audit-body'), rows, true);
			} catch (e) { handleError(e); }
		}

		const AUDIT_ACTIONS = {
			'auth.login': 'เข้าสู่ระบบ', 'user.register': 'สมัครใช้งาน', 'user.approve': 'อนุมัติผู้ใช้', 'user.reject': 'ปฏิเสธผู้ใช้',
			'user.disable': 'ระงับผู้ใช้', 'user.enable': 'เปิดใช้ผู้ใช้', 'user.update': 'เปลี่ยนสิทธิ์ผู้ใช้', 'user.reset_pin': 'รีเซ็ต PIN',
			'user.change_pin': 'เปลี่ยน PIN ตัวเอง', 'event.create': 'สร้าง Event', 'event.update': 'แก้ Event',
			'gift.create': 'เพิ่มของรางวัล', 'gift.update': 'แก้ของรางวัล', 'gift.delete': 'ลบของรางวัล', 'redemption.void': 'ยกเลิกรายการแลก', 'event.clear_test': 'ล้างข้อมูลทดสอบ'
		};
		const AUDIT_FIELDS = {
			event_name: 'ชื่อ Event', branch_code: 'รหัสสาขา', is_active: 'เปิดใช้งาน', use_member: 'ช่องรหัสสมาชิก', use_bill_no: 'ช่องเลขที่บิล',
			use_bill_amount: 'ช่องยอดบิล', use_photos: 'อัปโหลดรูป', use_note: 'หมายเหตุ', dedup_member: 'กันซ้ำด้วยสมาชิก', dedup_bill: 'กันซ้ำด้วยบิล',
			min_bill_amount: 'ยอดขั้นต่ำ', gift_name: 'ชื่อของรางวัล', stock: 'จำนวน', image: 'รูป', role: 'สิทธิ์', status: 'สถานะ'
		};
		function auditVal(k, v) {
			if (v === null || v === undefined || v === '') return '-';
			if (k === 'image') return v ? 'มีรูป' : 'ไม่มีรูป';
			if (v === true) return 'เปิด';
			if (v === false) return 'ปิด';
			if (k === 'role') return v === 'admin' ? 'Admin' : 'User';
			if (k === 'status') return ({ pending: 'รออนุมัติ', active: 'ใช้งาน', disabled: 'ระงับ' })[v] || v;
			return String(v);
		}
		function auditDetail(r) {
			const d = r.detail || {};
			if (r.action === 'event.update' || r.action === 'gift.update') {
				const parts = Object.keys(d).filter(function (k) { return k.charAt(0) !== '_' && AUDIT_FIELDS[k]; }).map(function (k) {
					return AUDIT_FIELDS[k] + ': ' + esc(auditVal(k, d[k].from)) + ' → <b>' + esc(auditVal(k, d[k].to)) + '</b>';
				});
				return (d._name && r.action === 'gift.update' ? esc(d._name) + ' · ' : '') + parts.join(' · ');
			}
			if (r.action === 'event.create') return esc(d.event_name) + ' · สาขา ' + esc(d.branch_code);
			if (r.action === 'gift.create') return esc(d.gift_name) + ' × ' + esc(d.stock) + (d.image ? ' (มีรูป)' : '');
			if (r.action === 'gift.delete') return esc(d.gift_name);
			if (r.action === 'event.clear_test') return esc(d._name || '') + ' · ลบ ' + esc(d.rows) + ' รายการ' + (d.photos ? ' · รูป ' + esc(d.photos) + ' รูป' : '');
			if (r.action === 'redemption.void') {
				return [d.memberId ? 'สมาชิก ' + esc(d.memberId) : null, d.billNo ? 'บิล ' + esc(d.billNo) : null, d.billAmount != null ? '฿' + money(d.billAmount) : null].filter(Boolean).join(' · ') +
					' — แลกโดย ' + esc(d.redeemedBy || '-') + ' เมื่อ ' + esc(d.redeemedAt || '-');
			}
			if (r.action.indexOf('user.') === 0 && d.name) {
				let t = esc(d.name) + (d.username ? ' @' + esc(d.username) : '');
				if (d.role && d.role.from !== d.role.to) t += ' · สิทธิ์: ' + auditVal('role', d.role.from) + ' → <b>' + auditVal('role', d.role.to) + '</b>';
				if (r.action === 'user.approve') t += ' · เป็น ' + auditVal('role', d.role && d.role.to);
				return t;
			}
			return '';
		}
		function renderAudit(el, rows, showEvent) {
			if (!rows.length) { el.innerHTML = '<div class="muted">ยังไม่มีประวัติ</div>'; return; }
			el.classList.remove('muted');
			el.innerHTML = rows.map(function (r) {
				return '<div class="au-row"><div class="h"><span><span class="who">' + esc(r.user) + '</span> <span class="a">' + esc(AUDIT_ACTIONS[r.action] || r.action) + '</span></span>' +
					'<span class="muted" style="white-space:nowrap">' + esc(r.ts.slice(0, 16)) + '</span></div>' +
					(showEvent && r.eventName ? '<div class="d">📍 ' + esc(r.eventName) + '</div>' : '') +
					'<div class="d">' + auditDetail(r) + '</div></div>';
			}).join('');
		}

				ED.event = null;
				ED.gifts = [{ id: null, name: '', stock: '', used: 0, image: null, hasImage: false }];

				$('ed-branch').value = '';

				$('ed-use-amount').checked = false;
				$('ed-use-note').checked = false;
				$('ed-use-photos').checked = false;
				$('ed-dedup-member').checked = true;
				$('ed-dedup-bill').checked = false;
				$('ed-min').value = '';
				images = {};
			} else {
				try {
					const d = await rpc('admin_get_event', { p_event_id: eventId });
					const e = d.event;
					ED.event = e;
					ED.gifts = d.gifts.map(function (g) { return { id: g.id, name: g.name, stock: g.stock, used: g.used, image: null, hasImage: g.hasImage }; });
					$('ed-title').textContent = 'ตั้งค่า Event';
					$('ed-name').value = e.name;
					$('ed-branch').value = e.branchCode;
					$('ed-active').checked = e.isActive;
					$('ed-use-member').checked = e.useMember;
					$('ed-use-bill').checked = e.useBillNo;
					$('ed-use-amount').checked = e.useBillAmount;
					$('ed-use-note').checked = !!e.useNote;
					$('ed-use-photos').checked = !!e.usePhotos;
					$('ed-dedup-member').checked = e.dedupMember;
					$('ed-dedup-bill').checked = e.dedupBill;
					$('ed-min').value = e.minBillAmount == null ? '' : e.minBillAmount;
				} catch (err) { handleError(err); return; }
			}
			syncEditorChecks();
			renderGiftRows();
			showView('view-admin-edit');
		}

		function cancelEditor() {
			if (ED.event) openAdminEvent(ED.event.id); else showAdminList();
		}

		// เปิด/ปิด checkbox กันซ้ำตามช่องที่เลือก + ล็อกถ้ามีการแลกแล้ว
		function syncEditorChecks() {
			const locked = !!(ED.event && ED.event.hasRedemptions);
			const useM = $('ed-use-member').checked, useB = $('ed-use-bill').checked, useA = $('ed-use-amount').checked;
			['ed-use-member', 'ed-use-bill', 'ed-use-amount'].forEach(function (id) { $(id).disabled = locked; $(id).parentNode.classList.toggle('disabled', locked); });
			if (!useM) $('ed-dedup-member').checked = false;
			if (!useB) $('ed-dedup-bill').checked = false;
			if (useM && !useB) $('ed-dedup-member').checked = true;
			if (useB && !useM) $('ed-dedup-bill').checked = true;
			$('ed-dedup-member').disabled = locked || !useM;
			$('ed-dedup-bill').disabled = locked || !useB;
			$('ed-dedup-member-row').classList.toggle('disabled', locked || !useM);
			$('ed-dedup-bill-row').classList.toggle('disabled', locked || !useB);
			$('ed-min-wrap').classList.toggle('hidden', !useA);
			$('ed-clear').classList.toggle('hidden', !locked);
			$('ed-lock-hint').textContent = locked ? '🔒 Event นี้มีการแลกแล้ว เปลี่ยนรหัสสมาชิก/เลขที่บิล/ยอดบิล/วิธีกันซ้ำไม่ได้ (หมายเหตุ รูป ชื่อ สาขา ยอดขั้นต่ำ และของรางวัลแก้ได้)' : '';
		}

		// ล้างรายการทดสอบ (ทำได้เมื่อทุกรายการถูกยกเลิกแล้ว) → Event กลับเป็นยังไม่มีการแลก
		function clearTestData() {
			confirmBox('ล้างข้อมูลทดสอบของ Event นี้?',
				'ลบรายการที่ยกเลิกแล้วและรายการพยายามแลกซ้ำทั้งหมด (รวมบิลและรูป) ทำได้เฉพาะเมื่อไม่มีรายการแลกจริงเหลืออยู่ · การตั้งค่าที่ยังไม่ได้บันทึกในหน้านี้จะหาย',
				async function () {
					try {
						const r = await rpc('admin_clear_test_data', { p_event_id: ED.event.id });
						alertModal('ล้างแล้ว ' + r.rows + ' รายการ' + (r.photos ? ' · รูป ' + r.photos + ' รูป' : '') + ' — แก้การตั้งค่าได้ทุกช่องแล้ว');
						openEditor(ED.event.id);
					} catch (e) { handleError(e); }
				});
		}

		function giftRowImg(g) {
			if (g.image) return '<img class="gift-img" src="' + g.image + '" alt="">';
			if (g.id && g.hasImage && images[g.id] && !g.removeImage) return '<img class="gift-img" src="' + images[g.id] + '" alt="">';
			return '<div class="gift-ph">📷</div>';
		}

		function renderGiftRows() {
			$('ed-gifts').innerHTML = ED.gifts.map(function (g, i) {
				const hasPic = !!(g.image || (g.hasImage && !g.removeImage));
				return '<div class="gift-edit">' +
					'<div class="pic" data-i="' + i + '">' + giftRowImg(g) + '<span>' + (hasPic ? 'เปลี่ยนรูป' : 'ใส่รูป') + '</span></div>' +
					'<div><div class="cols">' +
					'<input class="sm-input g-name" data-i="' + i + '" placeholder="ชื่อของรางวัล" value="' + esc(g.name) + '">' +
					'<input class="sm-input g-stock" data-i="' + i + '" inputmode="numeric" placeholder="จำนวน" value="' + esc(g.stock) + '">' +
					'</div><div class="acts"><span class="muted">' + (g.used ? 'แลกไปแล้ว ' + g.used + ' ชิ้น' : '') + '</span>' +
					'<span>' + (hasPic ? '<button class="chip g g-rmimg" data-i="' + i + '">ลบรูป</button> ' : '') +
					'<button class="chip g-del" data-i="' + i + '">ลบ</button></span></div></div></div>';
			}).join('') || '<div class="muted">ยังไม่มีของรางวัล</div>';

			$('ed-gifts').querySelectorAll('.pic').forEach(function (p) {
				p.addEventListener('click', function () { ED.pickIdx = Number(p.dataset.i); $('ed-file').value = ''; $('ed-file').click(); });
			});
			$('ed-gifts').querySelectorAll('.g-name').forEach(function (inp) {
				inp.addEventListener('input', function () { ED.gifts[Number(inp.dataset.i)].name = inp.value; });
			});
			$('ed-gifts').querySelectorAll('.g-stock').forEach(function (inp) {
				inp.addEventListener('input', function () { ED.gifts[Number(inp.dataset.i)].stock = inp.value; });
			});
			$('ed-gifts').querySelectorAll('.g-rmimg').forEach(function (b) {
				b.addEventListener('click', function () { const g = ED.gifts[Number(b.dataset.i)]; g.image = null; g.removeImage = true; renderGiftRows(); });
			});
			$('ed-gifts').querySelectorAll('.g-del').forEach(function (b) {
				b.addEventListener('click', function () {
					const i = Number(b.dataset.i), g = ED.gifts[i];
					if (g.id) ED.removed.push(g.id);
					ED.gifts.splice(i, 1);
					renderGiftRows();
				});
			});
		}

		function addGiftRow() {
			ED.gifts.push({ id: null, name: '', stock: '', used: 0, image: null, hasImage: false });
			renderGiftRows();
			const names = $('ed-gifts').querySelectorAll('.g-name');
			names[names.length - 1].focus();
		}

		// ย่อรูปให้ด้านยาวสุด 480px เป็น JPEG ก่อนส่ง
		// ย่อรูป: ด้านยาวสุด max px เป็น JPEG ไม่เกิน limit ตัวอักษร (ของรางวัล 480 / รูปถ่ายบิล 1280)
		function resizeImage(file, max, limit) {
			max = max || 480; limit = limit || 550000;
			return new Promise(function (resolve, reject) {
				const reader = new FileReader();
				reader.onerror = reject;
				reader.onload = function () {
					const img = new Image();
					img.onerror = function () { reject(new Error('เปิดไฟล์รูปไม่ได้')); };
					img.onload = function () {
						const scale = Math.min(1, max / Math.max(img.width, img.height));
						const c = document.createElement('canvas');
						c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
						const ctx = c.getContext('2d');
						ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
						ctx.drawImage(img, 0, 0, c.width, c.height);
						let q = 0.82, out = c.toDataURL('image/jpeg', q);
						while (out.length > limit && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
						resolve(out);
					};
					img.src = reader.result;
				};
				reader.readAsDataURL(file);
			});
		}

		$('ed-file').addEventListener('change', async function () {
			const f = this.files && this.files[0];
			if (!f || ED.pickIdx == null) return;
			try {
				const g = ED.gifts[ED.pickIdx];
				g.image = await resizeImage(f);
				g.removeImage = false;
				renderGiftRows();
			} catch (e) { alertModal(e.message); }
		});

		async function saveEditor() {
			const err = $('ed-err');
			err.textContent = '';
			const gifts = ED.gifts.map(function (g) { return Object.assign({}, g, { name: String(g.name).trim(), stock: String(g.stock).trim() }); });
			for (let i = 0; i < gifts.length; i++) {
				if (!gifts[i].name) { err.textContent = 'ของรางวัลชิ้นที่ ' + (i + 1) + ' ยังไม่มีชื่อ'; return; }
				if (!/^\d+$/.test(gifts[i].stock)) { err.textContent = 'จำนวนของ "' + gifts[i].name + '" ต้องเป็นตัวเลข'; return; }
			}
			if (!gifts.length) { err.textContent = 'ต้องมีของรางวัลอย่างน้อย 1 อย่าง'; return; }

			const btn = $('ed-save');
			btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
			try {
				const ev = await rpc('admin_save_event', { p_event: {
					id: ED.event ? ED.event.id : null,
					name: $('ed-name').value,
					branchCode: $('ed-branch').value,
					isActive: $('ed-active').checked,
					useMember: $('ed-use-member').checked,
					useBillNo: $('ed-use-bill').checked,
					useBillAmount: $('ed-use-amount').checked,
					useNote: $('ed-use-note').checked,
					usePhotos: $('ed-use-photos').checked,
					dedupMember: $('ed-dedup-member').checked,
					dedupBill: $('ed-dedup-bill').checked,
					minBillAmount: $('ed-min').value.trim() === '' ? null : Number($('ed-min').value.replace(/,/g, ''))
				} });
				ED.event = ev;

				for (let i = 0; i < ED.removed.length; i++) {
					await rpc('admin_delete_gift', { p_gift_id: ED.removed[i] });
				}
				ED.removed = [];

				for (let i = 0; i < gifts.length; i++) {
					btn.textContent = 'กำลังบันทึกของรางวัล ' + (i + 1) + '/' + gifts.length + '...';
					const g = gifts[i];
					const saved = await rpc('admin_save_gift', { p_gift: {
						id: g.id, eventId: ev.id, name: g.name, stock: Number(g.stock), sortOrder: i,
						image: g.image || null, removeImage: !!g.removeImage
					} });
					ED.gifts[i].id = saved.id;
					ED.gifts[i].image = null;
				}

				btn.disabled = false; btn.textContent = 'บันทึก';
				A.tab = 'summary';
				openAdminEvent(ev.id);
			} catch (e) {
				btn.disabled = false; btn.textContent = 'บันทึก';
				handleError(e, err);
			}
		}

		/* ---------- init ---------- */
		$('li-pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
		$('li-user').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('li-pin').focus(); });
		$('br-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitBranch(); });
		$('rg-pin2').addEventListener('keydown', function (e) { if (e.key === 'Enter') doRegister(); });

		// ให้ :active ทำงานบน iOS + สั่นเบาๆ บน Android
		document.addEventListener('touchstart', function () {}, { passive: true });
		document.addEventListener('click', function (e) {
			const b = e.target.closest('button');
			if (b && !b.disabled && navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
		});

		(function init() {
			store('gift_pin', null); // PIN แบบเก่า ไม่ใช้แล้ว
			$('li-user').value = load('gift_user');
			const saved = load('gift_token');
			if (saved) { pin = saved; routeAfterAuth().catch(function (e) { handleError(e); }); }
		})();
	</script>
